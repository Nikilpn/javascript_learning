<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">

        <!-- Title -->
        <h2 class="text-center mb-4" style="color: #2e7d52; font-weight: bold; letter-spacing: 2px;">TO DO LIST</h2>

        <!-- Table -->
        <table class="table table-bordered" style="width: 50%; margin: 0 auto;">
            <thead style="background-color: #2e7d52; color: white;">
                <tr>
                    <th>User Id</th>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Completed</th>
                </tr>
            </thead>
            <tbody id="result">
        


            </tbody>
        </table>

    </div>
</body>
<script>
    //create an instance to the class
    const obj=new XMLHttpRequest()
    // call the open method 
    obj.open("get","https://jsonplaceholder.typicode.com/todos")

    //request send
    obj.send()

    console.log(obj.readyState);

    obj.onreadystatechange=()=>{
        console.log(obj.readyState);
        if(obj.readyState==4){
            console.log("response recieved");
            // console.log(obj.responseText);

            if (obj.status>=200 && obj.status<300){

            let allTodo=JSON.parse(obj.responseText)
            console.log(allTodo);
            allTodo.forEach((item)=>{
            result.innerHTML += `
                <tr>
                    <td>${item.userId}</td>
                    <td>${item.id}</td>
                    <td>${item.title}</td>
                    <td>${item.completed}</td>
                </tr>
                `

            })

            }
            else{
                console.log("no response");
                
            }

            
            

            
        }else{
            console.log("no response");
            
        }
        
    }
    

</script>

</html>

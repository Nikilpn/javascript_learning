<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="./script.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* 🔥 Hero section */
        .hero {
            height: 300px;
            background: url('https://picsum.photos/1200/400') center/cover no-repeat;
            position: relative;
            color: white;
        }

        /* Dark overlay */
        .hero::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
        }

        /* Navbar content */
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
        }

        /* Logout button */
        .logout-btn {
            border: 1px solid red;
            color: red;
            padding: 5px 15px;
            border-radius: 20px;
            background: transparent;
        }

        .logout-btn:hover {
            background: red;
            color: white;
        }

        /* Welcome section */
        .welcome {
            padding: 40px;
            background: #f2f2f2;
        }

        .welcome h2 {
            
       
            display: inline-block;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <!-- 🔝 Hero Section -->
    <div class="hero">
        <div class="hero-content d-flex justify-content-between align-items-center">
            
            <!-- Left -->
            <div class="title">
                <i class="fa fa-home text-danger"></i> Landing Page
            </div>

            <!-- Right -->
            <button onclick="logout()" class="logout-btn">
                <i class="fa fa-power-off"></i> LOGOUT
            </button>

        </div>
    </div>

    <!-- 📄 Content Section -->
    <div class="welcome">
        <h2>Welcome <span id="username"></span></h2>

        <p class="mt-3">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Recusandae dolore non ipsum
            saepe harum eligendi voluptates quis voluptatibus quo laborum, in, est, iusto officia
            doloremque culpa asperiores aliquam? Amet voluptatem fugit mollitia deserunt.
        </p>
    </div>



    <script>
        const user=localStorage.getItem('user')
        console.log(user);
        username.innerHTML=user
        
        function logout(){
            localStorage.removeItem("user")
            window.location="login.html"
            alert("logout successfully")

        }
    </script>

</body>
</html>

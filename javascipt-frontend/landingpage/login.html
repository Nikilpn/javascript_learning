<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="./script.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
        }

        .card-box {
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            background: linear-gradient(to right, #f8bcbc, #ff2e2e);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            color: #0d6efd;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-custom {
            width: 100%;
        }

        .register-text {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card-box">
        <h2>LOGIN</h2>

        <form>
            <input id="loginUser" type="text" class="form-control mb-3" placeholder="Enter Username">
            <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Enter Password">

            <button onclick="obj.login()" type="button"  class="btn btn-primary btn-custom">Login</button>

            <div class="register-text">
                New User? <a href="register.html">Register</a>
            </div>
        </form>
    </div>

</body>
</html>
